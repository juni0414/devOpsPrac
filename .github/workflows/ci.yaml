name: ci
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome Step
        run: echo "Welcome to GitHub Actions"
      - name: Clone Repo
        uses: actions/checkout@v4
      - name: Repo Info
        run: |
          echo "Following is the info of the repo"
          echo "Repo Name: ${{ github.repository }}"
          echo "Event Name: ${{ github.event_name }}"
          git branch testing
          git branch
          git log
          git --version
          git config --local --list
